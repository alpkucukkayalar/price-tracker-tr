<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Fiyat Takip — Ayarlar</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>Fiyat Takip</h1>

    <label for="server">Uygulamanın adresi</label>
    <input id="server" type="text" placeholder="http://localhost:3100" autocomplete="off">
    <p class="muted">Kendi bilgisayarındaysa <code>http://localhost:3100</code> kalsın.</p>

    <label for="token">API anahtarı</label>
    <input id="token" type="password" placeholder="pt_…" autocomplete="off">
    <p class="muted">
      Anahtarı uygulamada
      <a id="settings-link" href="http://localhost:3100/settings" target="_blank">Ayarlar → Bağlı Uygulamalar</a>
      bölümünden üretip buraya yapıştır.
    </p>

    <div class="row">
      <button id="save">Kaydet</button>
      <button id="test">Bağlantıyı dene</button>
      <button id="clear" class="ghost">Anahtarı sil</button>
    </div>

    <div id="status" class="status"></div>
  </main>
  <script type="module" src="options.ts"></script>
</body>
</html>
