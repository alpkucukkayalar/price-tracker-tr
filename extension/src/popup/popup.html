<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="root"></div>

  <template id="tpl-form">
    <div class="header"><strong>Fiyat Takip'e ekle</strong><span class="host"></span></div>
    <div class="body">
      <label>Ürün adı</label>
      <input data-field="name" type="text" />

      <label>URL</label>
      <input data-field="url" type="text" readonly />

      <label>Hedef fiyat (isteğe bağlı)</label>
      <input data-field="threshold" type="text" placeholder="ör. 1.299,90" />

      <details class="advanced">
        <summary>Gelişmiş</summary>
        <label>CSS seçici (isteğe bağlı)</label>
        <input data-field="css" type="text" />
        <button data-action="pick-element" type="button" class="ghost-button" style="margin-top: 4px;">
          Sayfada fiyatı tıklayarak seç
        </button>
        <div data-pick-status class="muted small hidden" style="margin-top: 4px;"></div>
        <label>Kontrol aralığı (dakika)</label>
        <input data-field="interval" type="number" min="5" placeholder="360" />
      </details>

      <button data-action="add" class="primary">Takibe ekle</button>
      <div data-error class="error hidden"></div>
    </div>
  </template>

  <template id="tpl-no-token">
    <div class="header"><strong>API anahtarını ayarla</strong></div>
    <div class="body center">
      <p>Eklentinin, Fiyat Takip uygulamandan alınmış bir API anahtarına ihtiyacı var.</p>
      <button data-action="open-options" class="primary">Ayarları aç</button>
    </div>
  </template>

  <template id="tpl-success">
    <div class="header"><strong>Eklendi ✓</strong></div>
    <div class="body center">
      <div class="check-icon">✓</div>
      <div class="title">Takip ediliyor</div>
      <p class="muted">İlk fiyat birkaç dakika içinde okunacak.</p>

      <!-- Project picker — populated on mount, hidden if no projects -->
      <div data-add-to-project class="hidden project-picker">
        <label class="project-picker-label">Projeye ekle (isteğe bağlı)</label>
        <select data-project-select class="project-picker-select">
          <option value="">— Yok —</option>
        </select>
        <button data-add-project class="ghost-button project-picker-button">Projeye ekle</button>
      </div>

      <a data-link class="ghost-button" target="_blank">Ürünü aç →</a>
      <div class="muted small">2 sn içinde kapanır…</div>
    </div>
  </template>

  <template id="tpl-error">
    <div class="header"><strong>Eklenemedi</strong></div>
    <div class="body">
      <p data-msg></p>
      <button data-action="retry" class="primary">Tekrar dene</button>
      <button data-action="open-options" class="ghost">Ayarları aç</button>
    </div>
  </template>

  <template id="tpl-dup">
    <div class="header"><strong>Zaten takipte</strong><span class="host"></span></div>
    <div class="body">
      <div class="muted small" data-name></div>
      <div class="last-price">
        <span data-price>—</span>
        <span data-verdict class="verdict-pill hidden"></span>
      </div>
      <p class="muted" data-reason></p>

      <!-- Threshold edit affordance -->
      <div class="threshold-row">
        <span class="threshold-label">Hedef fiyat</span>
        <span data-threshold-display class="threshold-display">—</span>
        <button data-edit-threshold class="threshold-edit-btn">Düzenle</button>
      </div>
      <div data-threshold-edit class="hidden threshold-edit-row">
        <input data-threshold-input type="text" placeholder="ör. 1.299,90" class="threshold-input" />
        <button data-save-threshold class="threshold-save-btn">Kaydet</button>
      </div>

      <a data-link class="ghost-button" target="_blank">Fiyat Takip'te aç →</a>
    </div>
  </template>

  <template id="tpl-loading">
    <div class="header"><strong>Price Tracker</strong></div>
    <div class="body center loading">
      <div class="spinner"></div>
      <p class="muted small">Kontrol ediliyor…</p>
    </div>
  </template>

  <!-- Shown when the active tab isn't a normal http(s) product page —
       chrome://, about:, file://, javascript:, or pages whose URL has
       no real hostname (e.g., chrome://settings returns 'settings' as
       hostname). Distinct from tpl-error because there's nothing to
       retry; the user just needs to navigate to a real product URL. -->
  <template id="tpl-unsupported">
    <div class="header"><strong>Bu sayfa takip edilemez</strong></div>
    <div class="body">
      <p class="muted" data-msg></p>
      <p class="muted small">Bir mağazada (Trendyol, Amazon, Hepsiburada, Akakçe…) ürün sayfasını açıp eklentiye tekrar tıkla.</p>
    </div>
  </template>

  <!-- Always-visible footer: send every product link on this page (e.g. a
       favourites list) to the app's bulk import page. -->
  <div class="bulk-footer">
    <button id="bulk-send" type="button" class="ghost-button">Bu sayfadaki tüm ürünleri toplu aktar</button>
    <div id="bulk-status" class="muted small hidden"></div>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
